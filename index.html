<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Simple template</title>
  </head>
  <body>
    <video controls autoplay></video>
    <script type="module">
      // Browser bundle, not the Node entry at https://esm.sh/webtorrent
      import WebTorrent from 'https://esm.sh/webtorrent/dist/webtorrent.min.js'

      const client = new WebTorrent()

      // Sintel, a free, Creative Commons movie
      const torrentId = 'magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel&tr=udp%3A%2F%2Fexplodie.org%3A6969&tr=udp%3A%2F%2Ftracker.coppersurfer.tk%3A6969&tr=udp%3A%2F%2Ftracker.empire-js.us%3A1337&tr=udp%3A%2F%2Ftracker.leechers-paradise.org%3A6969&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337&tr=wss%3A%2F%2Ftracker.btorrent.xyz&tr=wss%3A%2F%2Ftracker.fastcast.nz&tr=wss%3A%2F%2Ftracker.openwebtorrent.com&ws=https%3A%2F%2Fwebtorrent.io%2Ftorrents%2F&xs=https%3A%2F%2Fwebtorrent.io%2Ftorrents%2Fsintel.torrent'

      // Service worker must be same-origin, so sw.min.js is served from this site.
      const controller = await navigator.serviceWorker.register('./sw.min.js', { scope: './' })
      await navigator.serviceWorker.ready
      client.createServer({ controller })

      client.add(torrentId, torrent => {
        // Torrents can contain many files. Let's use the .mp4 file
        const file = torrent.files.find(file => {
          return file.name.endsWith('.mp4')
        })

        // Display the file by adding it to the DOM.
        // Supports video, audio, image files, and more!
        file.streamTo(document.querySelector('video'))
      })
    </script>
    <script>
    
      var memory = new  WebAssembly.Memory({initial:1});

      function  consoleLogString(offset, length) {
        var  bytes = new  Uint8Array(memory.buffer, offset, length);
        var  string = new  TextDecoder('utf8').decode(bytes);
        console.log(string);
      };

      var  importObject = {
        console: {
          log:  consoleLogString
        },
        js : {
          mem:  memory
        }
      };
      
      WebAssembly.instantiateStreaming(fetch('helloworld.wasm'), importObject)
      .then(obj  => {
        obj.instance.exports.helloWorld();
      });
      
    </script>
  </body>
</html>
